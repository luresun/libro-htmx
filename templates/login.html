{% extends "base.html" %}

{% block title %}Login - Clean Architecture App{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Login</h2>
    
    {% if !message.is_empty() %}
    <div class="alert alert-{{ message_type }}">
        {{ message }}
    </div>
    {% endif %}
    
    <form
        method="post"
        action="/login"
        hx-post="/login"
        hx-target="body"
        hx-swap="innerHTML"
        hx-indicator="#loading-indicator"
    >
        <div id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    minlength="3"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="6"
                >
            </div>

            <button type="submit" class="btn">
                Login
                <span id="loading-indicator" class="htmx-indicator">⏳</span>
            </button>
        </div>
    </form>

    <p class="mt-3 text-center">
        Don't have an account? <a href="/register">Register here</a>
    </p>
</div>
{% endblock %}
