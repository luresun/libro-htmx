services:
  - type: web
    name: libro-htmx
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: ACCESS_TOKEN_TTL_SECS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "https://your-app.onrender.com,http://localhost:5173"
      - key: RUST_LOG
        value: "libro_htmx=debug,tower_http=debug,sqlx=warn"
